.book-image,.book-image a{background:transparent!important;box-shadow:none!important;border-radius:0!important}

.intro-inner{width:max-content;max-width:100%;margin-inline:auto;text-align:center}
.intro h1{text-align:left;max-width:100%}
/* A quiet ice-gray presentation mat behind artwork, without altering the artwork itself. */

}

}

}

<body>

  </div>
 </div>
</div>

<script>
(()=>{
'use strict';
const canvas = document.getElementById('scene');
const gl = canvas.getContext('webgl', {alpha:false, antialias:true, powerPreference:'high-performance'});
const $ = id => document.getElementById(id);
const intro = $('intro'), shelfMenu = $('shelfMenu'), detail = $('detail');
const shelfNames={web:'Webの棚',app:'Appの棚',cx:'CXの棚',graphic:'グラフィックの棚',career:'経歴の棚'};
const categories=Object.fromEntries(Object.keys(shelfNames).map(name=>[name,items.filter(item=>item.shelf===name)]));
let category='web',entranceTimer=0;
let state = 'entrance', selected = 0, detailTimer = 0;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let motion = !reduced;
const cam = {x:0,y:2.55,z:13.6,tx:0,ty:1.25,tz:-8.2}, from = {...cam}, to = {...cam};
let start = 0, duration = 1, animating = false, mouseX = 0, mouseY = 0, width = 0, height = 0, dpr = 1;
function go(next, ms){Object.assign(from, cam); Object.assign(to, next); start = performance.now(); duration = motion ? ms : 1; animating = true;}
function updateStatus(code, title, sub){$('chapterNumber').textContent = code; $('chapterTitle').innerHTML = title + '<span>' + sub + '</span>';}
function setBodyState(next){state = next; document.body.dataset.state = next;}
function enter(){clearTimeout(entranceTimer);setBodyState('walk');intro.classList.add('hide');shelfMenu.classList.remove('show');updateStatus('01','THE GALLERY','書店を歩く');go({x:0,y:1.72,z:4.7,tx:0,ty:1.50,tz:-4.8},3200);entranceTimer=setTimeout(()=>{if(state==='walk'){setBodyState('aisle');shelfMenu.classList.add('show');switchShelf(category,true);}},motion?2700:50);}
function reset(){clearTimeout(detailTimer);clearTimeout(entranceTimer);closeDetail();setBodyState('entrance');intro.classList.remove('hide');shelfMenu.classList.remove('show');clearActive();updateStatus('00','ENTRANCE','入口 / はじめに');go({x:0,y:2.55,z:13.6,tx:0,ty:1.25,tz:-8.2},1600);}
function clearActive(){document.querySelectorAll('.spine').forEach(el => el.classList.remove('active'));}

function selectItem(index){if(state==='entrance')enter();clearTimeout(entranceTimer);selected=index;const item=items[index];setBodyState('focus');activateSpine(item.id);closeDetail(true);updateStatus(String(index+2).padStart(2,'0'),item.en,item.title);const x=item.side*2.52;go({x:x*.32,y:1.64,z:item.z+1.34,tx:x,ty:1.52,tz:item.z-.1},1350);clearTimeout(detailTimer);detailTimer=setTimeout(()=>showDetail(index),motion?1100:30);}

function switchShelf(name,skipCamera=false){

 const title=shelfNames[name];

 updateStatus('01','THE SHELVES',title);
 if(!skipCamera){setBodyState('aisle');let view={web:{x:.5,y:1.65,z:3.4,tx:2.8,ty:1.5,tz:.2},app:{x:.45,y:1.65,z:1.5,tx:2.9,ty:1.5,tz:-4.8},cx:{x:0,y:1.65,z:4.5,tx:2.8,ty:1.5,tz:3.6},graphic:{x:-.45,y:1.65,z:4.1,tx:-2.8,ty:1.5,tz:1.8},career:{x:-.45,y:1.65,z:3.5,tx:-2.8,ty:1.5,tz:.5}}[name];go(view,1550);}

document.querySelectorAll('.shelf-category').forEach(button=>button.addEventListener('click',()=>switchShelf(button.dataset.category)));
let spreads=[], currentSpread=0, turning=false, flipFinishTimer=0;
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function pageShell(){return el('div','paper-content');}
function externalLink(url,label){

 link.href=url;link.target='_blank';link.rel='noopener noreferrer';
 return link;
}
function makePages(item){
 const pages=[];
 const opening=pageShell();
 opening.append(el('p','paper-eyebrow',item.en+' / '+item.category));
 opening.append(el('h2','paper-title',item.title));
 opening.append(el('div','paper-rule'));
 opening.append(el('p','paper-lead',item.desc));
 opening.append(el('div','paper-foot','MARINA HARA  ·  PORTFOLIO'));
 pages.push(opening);
 const outline=pageShell();
 outline.append(el('p','paper-eyebrow','INFORMATION / 概要'));
 const facts=el('dl','facts');[[item.type==='career'?'期間':'制作期間',item.period],['担当',item.role],['事業・制作規模',item.scope]].forEach(([k,v])=>{if(!v)return;facts.append(el('dt','',k),el('dd','',v));});
 outline.append(facts);
 const tags=el('div','tags');for(const tag of item.tags||[])tags.append(el('span','',tag));if(tags.childElementCount)outline.append(tags);
 if(facts.childElementCount||tags.childElementCount)pages.push(outline);
 for(let i=0;i<item.sections.length;i++){
  const sec=item.sections[i], page=pageShell();
  page.append(el('p','paper-eyebrow',String(i+1).padStart(2,'0')+' / '+item.en));
  page.append(el('h3','paper-heading',sec.title));
  if(sec.period)page.append(el('p','paper-eyebrow',sec.period));
  if(sec.body)for(const paragraph of sec.body.split(/\n\s*\n/))page.append(el('p','paper-paragraph',paragraph));
  if(sec.bullets&&sec.bullets.length){const ul=el('ul','paper-list');sec.bullets.forEach(b=>ul.append(el('li','',b)));page.append(ul);}
  if(sec.fact)page.append(el('p','paper-paragraph paper-fact',sec.fact));
  if(sec.note)page.append(el('p','paper-paragraph',sec.note));
  if(sec.url)page.append(externalLink(sec.url,sec.linkLabel));
  page.append(el('div','paper-foot','CHAPTER '+String(i+1).padStart(2,'0')));
  pages.push(page);
 }
 for(const [index,src] of (item.images||[]).entries()){
  const page=pageShell();
  const title=item.id==='career-profile'?'プロフィール写真':item.images.length>1?'制作画面 '+(index+1)+' / '+item.images.length:'制作画面';
  page.append(el('h3','paper-heading',title));
  const figure=el('figure','book-image');
  const link=externalLink(src,'');link.classList.add('image-viewer');
  const image=el('img');
  image.src=src;image.alt=item.title+' '+title;image.loading='lazy';
  if(item.id==='work-web6'){image.dataset.crop='front';link.dataset.crop='front';}
  if(item.id==='work-web12'){image.dataset.crop='bank';link.dataset.crop='bank';}
  link.append(image);
  figure.append(link,el('figcaption','','画像をタップして拡大'));
  page.append(figure);
  pages.push(page);
 }

  return pages;
}
function isSmallReader(){return window.matchMedia('(max-width:860px)').matches;}
function allPages(){return spreads.flat().filter(page=>!page.dataset.facingBlank);}
function countPages(){return isSmallReader()?allPages().length:spreads.length;}
function cropPresentedImages(){
  document.querySelectorAll('.page img[data-crop],.flip-face img[data-crop]').forEach(im=>{
    if(im.dataset.cropped==='yes')return;
    const process=()=>{
      if(!im.naturalWidth||!im.naturalHeight)return;
      const w=im.naturalWidth,h=im.naturalHeight;
      const kind=im.dataset.crop;
      // Exclude the unfinished left navigation on the curriculum screenshot.
      const left=kind==='front'?Math.min(180,Math.round(w*.20)):Math.round(w*.09);
      const top=kind==='bank'?Math.round(h*.08):0;
      const sw=kind==='front'?w-left:Math.round(w*.82);
      const sh=kind==='bank'?Math.round(h*.72):h;
      if(sw<10||sh<10)return;
      const scale=Math.min(1,2400/Math.max(sw,sh));
      const can=document.createElement('canvas');can.width=Math.max(1,Math.round(sw*scale));can.height=Math.max(1,Math.round(sh*scale));
      const ctx=can.getContext('2d');if(!ctx)return;
      ctx.fillStyle='#ffffff';ctx.fillRect(0,0,can.width,can.height);
      ctx.drawImage(im,left,top,sw,sh,0,0,can.width,can.height);
      try{const url=can.toDataURL('image/jpeg',.92);const anchor=im.closest('a');if(anchor)anchor.href=url;im.dataset.cropped='yes';im.src=url;}catch(e){/* Same-origin artwork is expected; leave original if blocked. */}
    };
    if(im.complete&&im.naturalWidth)process();else im.addEventListener('load',process,{once:true});
  });
}
function renderSpread(index){
 const mobile=isSmallReader();
 if(mobile){const pages=allPages(),page=pages[index];if(!page)return;
 $('pageLeft').replaceChildren(page.cloneNode(true));
 $('pageRight').replaceChildren(pages[index+1]?pages[index+1].cloneNode(true):document.createElement('div'));
 $('pageLabel').textContent=String(index+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');
 }else{const pair=spreads[index];if(!pair)return;
 $('pageLeft').replaceChildren(pair[0].cloneNode(true));
 $('pageRight').replaceChildren(pair[1].cloneNode(true));
 $('pageLabel').textContent=String(index*2+1).padStart(2,'0')+' — '+String(index*2+2).padStart(2,'0')+' / '+String(spreads.length*2).padStart(2,'0');}
 $('prevPage').disabled=index===0;$('nextPage').disabled=index>=countPages()-1;
 $('pageLeft').scrollTop=0;$('pageRight').scrollTop=0;
 cropPresentedImages();
}
function turnPage(direction){
 if(turning||!detail.classList.contains('show'))return;
 const target=currentSpread+direction;
 if(target<0||target>=countPages())return;
 const sheet=$('flipSheet'),front=$('flipFront'),back=$('flipBack');
 const mobile=isSmallReader(),pages=allPages();
 turning=true;sheet.className='flip-sheet '+(direction>0?'forward':'backward');
 if(mobile){front.replaceChildren(pages[currentSpread].cloneNode(true));back.replaceChildren(pages[target].cloneNode(true));}
 else{const current=spreads[currentSpread],next=spreads[target];front.replaceChildren(current[direction>0?1:0].cloneNode(true));back.replaceChildren(next[direction>0?0:1].cloneNode(true));}
 currentSpread=target;renderSpread(target);sheet.offsetWidth;
 requestAnimationFrame(()=>sheet.classList.add('turning'));
 clearTimeout(flipFinishTimer);flipFinishTimer=setTimeout(()=>{sheet.className='flip-sheet';front.replaceChildren();back.replaceChildren();turning=false;},motion?780:30);
}
function showDetail(index){
 const item=items[index];
 const pages=makePages(item);spreads=[];
 for(let i=0;i<pages.length;i+=2){const facing=pages[i+1]||pageShell();if(!pages[i+1])facing.dataset.facingBlank='true';spreads.push([pages[i],facing]);}
 currentSpread=0;turning=false;clearTimeout(flipFinishTimer);
 $('flipSheet').className='flip-sheet';
 renderSpread(0);
 detail.classList.add('show');detail.setAttribute('aria-hidden','false');
 $('bookShell').classList.remove('book-ready');
 requestAnimationFrame(()=>$('bookShell').classList.add('book-ready'));
}
function closeDetail(silent){
 detail.classList.remove('show');detail.setAttribute('aria-hidden','true');
 $('bookShell').classList.remove('book-ready');
 clearTimeout(flipFinishTimer);turning=false;$('flipSheet').className='flip-sheet';
 if(!silent)clearTimeout(detailTimer);
}
function renderShelf(listId,data){
 const root=$(listId);root.replaceChildren();root.scrollLeft=0;
 data.forEach((item,i)=>{
  const button=el('button','spine');button.type='button';button.dataset.id=item.id;
  button.style.setProperty('--cover',item.color);
  button.style.height=(item.type==='career'?122:137)+(i%3)*10+'px';
  const band=el('span','spine-band');band.setAttribute('aria-hidden','true');
  const name=el('span','spine-name',item.spine);
  const serial=el('span','spine-number',String(i+1).padStart(2,'0'));
  button.append(band,name,serial);
  button.title=item.title;
  button.setAttribute('aria-label',item.title+'を読む');
  button.addEventListener('click',()=>selectItem(items.findIndex(x=>x.id===item.id)));
  root.append(button);

}
switchShelf('web',true);
$('enter').addEventListener('click', enter);
$('homeBrand').addEventListener('click', reset);
$('closeDetail').addEventListener('click', () => closeDetail());
detail.addEventListener('click', e => { if(e.target === detail) closeDetail(); });
$('prevPage').addEventListener('click',()=>turnPage(-1));
$('nextPage').addEventListener('click',()=>turnPage(1));
let touchStart=null;
$('bookSpread').addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart=[e.touches[0].clientX,e.touches[0].clientY];},{passive:true});
$('bookSpread').addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];touchStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)turnPage(dx<0?1:-1);},{passive:true});
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(detail.classList.contains('show'))closeDetail();else reset();return;}
 if(detail.classList.contains('show')){if(e.key==='ArrowRight')turnPage(1);if(e.key==='ArrowLeft')turnPage(-1);return;}
 if(state==='entrance')return;
 if(e.key==='ArrowRight'||e.key==='ArrowDown')selectItem((selected+1)%items.length);
 if(e.key==='ArrowLeft'||e.key==='ArrowUp')selectItem((selected+items.length-1)%items.length);
});
window.addEventListener('pointermove', e => { mouseX = (e.clientX / innerWidth - .5) * 2; mouseY = (e.clientY / innerHeight - .5) * 2; });
let wheelLock = 0; window.addEventListener('wheel', e => { if(detail.classList.contains('show')||Math.abs(e.deltaY) < 20) return; const now = Date.now(); if(now - wheelLock < 900) return; wheelLock = now; if(state==='entrance'&&e.deltaY>0){enter();return;}if(state==='aisle'&&!e.target.closest('#activeShelf')){const keys=Object.keys(shelfNames);switchShelf(keys[(keys.indexOf(category)+(e.deltaY>0?1:keys.length-1))%keys.length]);} }, {passive:true});
let dragStart = null; canvas.addEventListener('pointerdown', e => { dragStart = [e.clientX, e.clientY]; }); canvas.addEventListener('pointerup', e => { if(!dragStart) return; const dx = e.clientX - dragStart[0], dy = e.clientY - dragStart[1]; dragStart = null; if(state === 'entrance' && Math.abs(dx) + Math.abs(dy) > 40){ enter(); return; } if(state !== 'entrance' && Math.abs(dx) > 60){ selectItem((selected + (dx < 0 ? 1 : items.length - 1)) % items.length); } });
if(!gl){ $('hint').textContent = '3Dが使えない環境です。棚から作品を選んで閲覧してください。'; enter(); return; }
const pos = [], norm = [], color = [];
function rgb(hex){ hex = hex.replace('#',''); return [parseInt(hex.slice(0,2),16)/255, parseInt(hex.slice(2,4),16)/255, parseInt(hex.slice(4,6),16)/255]; }
function addBox(x,y,z,w,h,d,hex){ const c = rgb(hex), x0 = x - w/2, x1 = x + w/2, y0 = y - h/2, y1 = y + h/2, z0 = z - d/2, z1 = z + d/2; const faces = [[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1]],[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1]],[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[1,0,0]],[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[-1,0,0]],[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],[0,1,0]],[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0]]]; for(const face of faces){ const n = face[4]; for(const j of [0,1,2,0,2,3]){ pos.push(...face[j]); norm.push(...n); color.push(...c); } } }
function addSphere(cx,cy,cz,r,hex,segments, rings){ const c = rgb(hex); for(let i=0;i<rings;i++){ const a = i*Math.PI/rings, b = (i+1)*Math.PI/rings; for(let j=0;j<segments;j++){ const u = j*Math.PI*2/segments, v = (j+1)*Math.PI*2/segments; const pts = [[a,u],[b,u],[b,v],[a,u],[b,v],[a,v]]; for(const pair of pts){ const theta = pair[0], phi = pair[1]; const nx = Math.sin(theta)*Math.cos(phi), ny = Math.cos(theta), nz = Math.sin(theta)*Math.sin(phi); pos.push(cx+nx*r, cy+ny*r, cz+nz*r); norm.push(nx,ny,nz); color.push(...c); } } } }
function addColumn(x,z){ addBox(x,1.95,z,.22,3.9,.22,'#d6d0c3'); addBox(x,.1,z,.36,.2,.36,'#bcb4a7'); }
